server {
    listen 80;
    listen [::]:80;
    server_name www.imgmesser.com;

    client_max_body_size 250M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.imgmesser.com;

    client_max_body_size 250M;

    ssl_certificate /etc/letsencrypt/live/www.imgmesser.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.imgmesser.com/privkey.pem;

    # You may need to create this file for extra SSL settings
    #include /etc/nginx/snippets/ssl-params.conf;

    location / {
        # Static files
        root /usr/share/nginx/html;
        index index.html index.htm;
        # SPA routing
        try_files $uri $uri/ /index.html;
    }

    location = /worker.js {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache static assets heavily for offline capabilities
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest|json)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    location /data/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
