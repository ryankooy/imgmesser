name: CI/CD Production Pipeline

# Trigger the workflow on tag pushes from `stable` branch
on:
  push:
    branches:
      - stable
    tags:
      - '*' # Triggers on all tag pushes

jobs:
  # 1. BUILD AND PUSH SVELTE FRONTEND IMAGE
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/imgmesser-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. BUILD AND PUSH RUST BACKEND IMAGE
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/imgmesser-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. COPY DEPLOYMENT FILES TO EC2
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy_files/*"
          target: "~/"
          strip_components: 1

  # 4. DEPLOY JOB: SSH INTO EC2 AND UPDATE SERVICES
  deploy:
    runs-on: ubuntu-latest
    needs: [build-app, build-api, copy-files]
    if: startsWith(github.ref, 'refs/tags/') && github.ref_name == 'stable'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Create Docker network if it doesn't exist
            docker network create --driver bridge \
              --subnet "${{ secrets.DOCKER_NETWORK_SUBNET }}" \
              --gateway "${{ secrets.DOCKER_NETWORK_GATEWAY }}" \
              imgmesser-nw || true

            export DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            export API_DOCKER_IP="${{ secrets.API_DOCKER_IP }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_DB="${{ secrets. POSTGRES_DB }}"
            export CERTBOT_DOMAIN="${{ secrets.CERTBOT_DOMAIN }}"
            export CERTBOT_EMAIL="${{ secrets.CERTBOT_EMAIL }}"

            # Fetch the newly pushed container updates
            docker compose pull

            # Run certbot service and create dummy certs
            docker compose run --rm \
              --entrypoint "/opt/certbot/tools/make_dummy_certs.sh" certbot

            # Restart modified services smoothly in detached mode
            docker compose --profile nginx up --detach --remove-orphans

            # Run certbot again separately to create real certs
            docker compose run --rm \
              --entrypoint "/opt/certbot/tools/make_certs.sh" certbot

            # Reload Nginx in running client container
            docker compose exec app nginx -s reload

            # Restart `api` service in detached mode
            docker compose up --detach --remove-orphans api

            # Prune stale image layers to keep EC2 storage footprint small
            docker image prune -f

