name: CI/CD Production Pipeline

# Trigger the workflow on pushes from `stable` branch
on:
  push:
    branches: [ stable ]
  workflow_dispatch:  # Allow manual triggering in GitHub Actions
    inputs:
      force_deploy:
        description: 'Force run the deploy job?'
        required: false
        type: boolean
        default: false

jobs:
  # 1. BUILD AND PUSH RUST BACKEND AND SVELTE FRONTEND IMAGES
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend-image
            image-name: ${{ secrets.DOCKERHUB_USERNAME }}/imgmesser-api
          - target: frontend-image
            image-name: ${{ secrets.DOCKERHUB_USERNAME }}/imgmesser-app
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image-name }}:latest
            ${{ matrix.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. COPY DEPLOYMENT FILES TO EC2
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "deploy_files/*"
          target: "~/"
          strip_components: 1

  # 3. DEPLOY JOB: SSH INTO EC2 AND UPDATE SERVICES
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, copy-files]
    if: github.ref_name == 'stable' || inputs.force_deploy == true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Create Docker network if it doesn't exist
            if docker network inspect imgmesser-nw > /dev/null 2>&1; then
              echo 'Network exists'
            else
              docker network create --driver bridge \
                --subnet "${{ secrets.DOCKER_NETWORK_SUBNET }}" \
                --gateway "${{ secrets.DOCKER_NETWORK_GATEWAY }}" \
                imgmesser-nw
            fi

            export DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            export API_DOCKER_IP="${{ secrets.API_DOCKER_IP }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_DB="${{ secrets. POSTGRES_DB }}"
            export CERTBOT_DOMAIN="${{ secrets.CERTBOT_DOMAIN }}"
            export CERTBOT_EMAIL="${{ secrets.CERTBOT_EMAIL }}"

            # Fetch the newly pushed container updates
            docker compose pull app api

            # Run certbot service and create dummy certs
            docker compose run --rm \
              -e DOMAIN="${CERTBOT_DOMAIN}" \
              --entrypoint "/opt/certbot/tools/make_dummy_certs.sh" \
              certbot

            # Run `app` service in a new container
            docker compose --profile nginx up --detach

            # Run certbot again separately to create real certs
            docker compose run --rm \
              -e DOMAIN="${CERTBOT_DOMAIN}" \
              -e EMAIL="${CERTBOT_EMAIL}" \
              --entrypoint "/opt/certbot/tools/make_certs.sh" \
              certbot

            # Reload Nginx in `app` container
            docker compose exec app nginx -s reload

            # Restart all services in detached mode
            docker compose up --detach

            # Prune stale image layers to keep EC2 storage footprint small
            docker image prune -f

